<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Text Reader</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>Photo Text Reader</h1>
        <p>Convert images into editable text using OCR.</p>
    </header>

    <main class="container">

        <section class="upload-section">
            <h2>Upload an Image</h2>

            <label for="imageInput" class="upload-box">
                <span class="upload-icon">+</span>
                <span>Choose an image</span>
                <small>JPG, PNG, or JPEG</small>
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/png, image/jpeg"
                hidden
            >

            <div class="preview-container">
                <img
                    id="imagePreview"
                    alt="Uploaded image preview"
                    hidden
                >
            </div>

            <button id="extractButton" disabled>
                Extract Text
            </button>
        </section>

        <section class="result-section">
            <h2>Extracted Text</h2>
            <textarea
                id="textOutput"
                placeholder="Your extracted text will appear here..."
            ></textarea>

            <div class="result-buttons">
                <button id="copyButton">
                    Copy Text
                </button>

                <button id="downloadButton">
                    Download TXT
                </button>

                <button id="clearButton">
                    Clear
                </button>
            </div>

            <p id="statusMessage">
                Upload an image to get started.
            </p>
        </section>
    </main>
  
    <footer>
        <p>Photo Text Reader | Multimedia Project</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
